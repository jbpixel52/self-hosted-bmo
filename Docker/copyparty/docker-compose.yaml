# Docker Compose configuration for Copyparty - File sharing service
services:
  ac:
    container_name: copyparty
    hostname: copyparty_host
    user: "99:100"
    image: copyparty/ac
    restart: unless-stopped
    ports:
      - '3923:3923'
    volumes:
      - '/mnt/user/:/shares'
      - '/mnt/user/appdata/copyparty:/cfg'
    labels:
      # Tailnet-only service: HTTPS on 443 -> container port 3923 (HTTP)
      - "docktail.service.enable=true"
      - "docktail.service.name=copyparty"
      - "docktail.service.port=3923"
      - "docktail.service.service-port=443"
      - "docktail.service.direct=false"

      # Public Funnel, mounted at a path (node funnel root "/" is taken by seerr)
      - "docktail.funnel.enable=true"
      - "docktail.funnel.port=3923"
      - "docktail.funnel.path=/copyparty"
