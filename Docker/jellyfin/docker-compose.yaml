# Docker Compose configuration for Jellyfin - Media server
services:
  # Jellyfin - Media server for movies, TV shows and music
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - DOCKER_MODS=linuxserver/mods:jellyfin-opencl-intel
    volumes:
      - /mnt/appdata/jellyfin/library:/config
      - /mnt/storage/movies:/movies
      - /mnt/storage/tvshows:/tvshows
      - /mnt/storage/music:/music
      - /mnt/storage/downloads:/downloads
      - /mnt/storage/anime:/anime
      - "/etc/localtime:/etc/localtime:ro"
      - "/tmp:/transcode"
    ports:
      #- 8096:8096
      - 8920:8920 #optional
      - 7359:7359/udp #optional
      - 1900:1900/udp #optional
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=jf"
      - "docktail.service.port=8096"
    #   - "docktail.funnel.enable=true"
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri #optional
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    hostname: seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=America/Los_Angeles
      - PORT=5055
    # ports:
    #- 5055:5055
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=requests"
      - "docktail.service.port=5055"
      # - "docktail.funnel.enable=true"
    volumes:
      - /mnt/appdata/seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    restart: unless-stopped
