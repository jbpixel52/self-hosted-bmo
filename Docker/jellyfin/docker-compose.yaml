# Docker Compose configuration for Jellyfin - Media server
services:
  # Jellyfin - Media server for movies, TV shows and music
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - DOCKER_MODS=linuxserver/mods:jellyfin-opencl-intel
    volumes:
      - /mnt/appdata/jellyfin/library:/config
      - /mnt/appdata/jellyfin/jellyfin/config/custom-cont-init.d://custom-cont-init.d
      - /mnt/storage/movies:/movies
      - /mnt/storage/tvshows:/tvshows
      - /mnt/storage/music:/music
      - /mnt/storage/downloads:/downloads
      - /mnt/storage/anime:/anime
      - "/etc/localtime:/etc/localtime:ro"
      - "/tmp:/transcode"
    ports:
      - 8096:8096
      - 8920:8920 #optional
      - 7359:7359/udp #optional
      - 1900:1900/udp #optional
    extra_hosts:
      - "host.docker.internal:172.17.0.1"
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.direct=false"
      - "docktail.service.port=8096"
      - "docktail.service.name=jellyfin"
      # Serve the tailnet service on 443 with TLS terminated by Tailscale, so
      # it is always https://jellyfin.<tailnet>.ts.net (was http on :80).
      # The backend stays plain http - that hop never leaves the host.
      - "docktail.service.service-port=443"
      - "docktail.service.service-protocol=https"

      - "docktail.funnel.enable=true"
      - "docktail.funnel.port=8096"
      - "docktail.funnel.path=/jellyfin"

    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri #optional

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    hostname: seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=America/Los_Angeles
      - PORT=5055
    # ports:
    #- 5055:5055
    extra_hosts:
      - "host.docker.internal:172.17.0.1"
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=seerr"
      - "docktail.service.port=5055"
      # Already https in practice; make it explicit so it cannot drift back to
      # plain http if docktail's defaults ever change.
      - "docktail.service.service-port=443"
      - "docktail.service.service-protocol=https"
      - "docktail.funnel.enable=true"
      - "docktail.funnel.port=5055"
      # Seerr's assets are root-absolute (/_next, /api/v1, ...), so it cannot be
      # served under a sub-path. Give it the root of its own funnel port instead
      # (443 is shared by jellyfin/copyparty via paths; 8443 is wizarr).
      - "docktail.funnel.funnel-port=10000"
    volumes:
      - /mnt/appdata/seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    restart: unless-stopped

  wizarr:
    container_name: wizarr
    image: ghcr.io/wizarrrr/wizarr
    #ports:
      #- 5690:5690
    extra_hosts:
      - "host.docker.internal:172.17.0.1"
    volumes:
      - /mnt/appdata/wizarr:/data
    environment:
      - PUID=1000 #Set UID
      - PGID=1000 #Set GID
      - DISABLE_BUILTIN_AUTH=false #Set to true ONLY if you are using another auth provider (Authelia, Authentik, etc)
      - TZ=America/Los_Angeles
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=wizarr"
      - "docktail.service.port=5690"
      - "docktail.service.service-port=443"

      # Wizarr does not support being served under a sub-path (its redirects are
      # root-absolute: /admin, /login), so it needs the root of its own public
      # funnel port. Funnels only support 443, 8443 and 10000, and 443 is
      # already shared by seerr/jellyfin/copyparty via distinct paths.
      - "docktail.funnel.enable=true"
      - "docktail.funnel.port=5690"
      - "docktail.funnel.funnel-port=8443"