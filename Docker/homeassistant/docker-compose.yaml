# Docker Compose configuration for Home Assistant - Home automation

services:
  # Home Assistant - Home automation platform
  homeassistant:
    image: lscr.io/linuxserver/homeassistant:latest
    container_name: homeassistant
    network_mode: host
    extra_hosts:
      - "host.docker.internal:172.17.0.1"
    environment:
      - PUID=99
      - PGID=100
      - TZ=America/Los_Angeles
    volumes:
      - /mnt/user/appdata/homeassistant:/config
    restart: unless-stopped
    devices:
      - /dev/serial/by-id/usb-Nabu_Casa_ZBT-2_1CDBD45F1FA4-if00:/dev/ttyACM0

    labels:
      # Tailnet-only service: HTTPS on 443 -> container port 8123 (HTTP).
      # network_mode: host publishes nothing, so docktail uses direct mode (the
      # default) and reaches it on 127.0.0.1:8123.
      - "docktail.service.enable=true"
      - "docktail.service.name=homeassistant"
      - "docktail.service.port=8123"
      - "docktail.service.service-port=443"
      - "docktail.service.service-protocol=https"
  # Frigate - Docker service
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:stable
    shm_size: 1gb # update for your cameras based on calculation above
    privileged: true
    cap_add:
      - CAP_PERFMON
    extra_hosts:
      - "host.docker.internal:172.17.0.1"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /mnt/appdata/frigate/config/:/config/
      - /mnt/appdata/frigate/recordings:/media/frigate
      - type: tmpfs # Optional: 1GB of memory, reduces SSD/SD Card wear
        target: /tmp/cache
        tmpfs:
          size: 5000000000
    ports:
      - "5500:5000"
      - "1935:1935" # RTMP feeds
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    environment:
      - FRIGATE_RTSP_PASSWORD= "password"
    restart: unless-stopped
    # Map the whole /dev/dri directory, as the jellyfin stack does on this host:
    # mother exposes card1 + renderD128 and has no card0.
    devices:
      - /dev/dri:/dev/dri
    labels:
      # Tailnet-only service: HTTPS on 443 -> container port 5000 (the app's
      # port; it is published on the host as 5500).
      - "docktail.service.enable=true"
      - "docktail.service.name=frigate"
      - "docktail.service.port=5000"
      - "docktail.service.service-port=443"
      - "docktail.service.service-protocol=https"
    deploy: 
      resources:
        limits:
          memory: 3G
  # Mosquitto - Docker service
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    hostname: mosquitto_host
    # Broker config lives in /mnt/appdata/mosquitto/config/mosquitto.conf
    # (auth required; user "mqtt", password file alongside it).
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:172.17.0.1"
    volumes:
      - /mnt/appdata/mosquitto/config:/mosquitto/config/
      - /mnt/appdata/mosquitto/log/:/mosquitto/log/
      - /mnt/appdata/mosquitto/data/:/mosquitto/data/
    ports:
      - 1883:1883
      - 9901:9001
