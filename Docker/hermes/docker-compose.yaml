services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    networks:
      - ai
    volumes:
      - /mnt/user/appdata/hermes:/opt/data
    environment:
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_INSECURE= True
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    ports:
      - "8642:8642"   # gateway API
      - "9119:9119"   # dashboard (only reached when HERMES_DASHBOARD=1)

    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "hermes"
      # HTTPS on 443 -> container port 8642 (HTTP)
      tsdproxy.port.1: "443/https:8642/http"  # gateway HTTP for inbound webhooks
      tsdproxy.port.2: "80/http->https://hermes.java-regulus.ts.net"
      tsdproxy.port.3: "443/https:9119/http"

    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "2.0"

    healthcheck:
      test: ["CMD", "hermes", "doctor", "--quiet"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  chrome:
    image: zenika/alpine-chrome:latest
    hostname: chrome
    container_name: chrome
    command: [chromium-browser, "--headless", "--disable-gpu", "--no-sandbox", "--remote-debugging-address=0.0.0.0", "--remote-debugging-port=9222"]
    ports:
      - "9222:9222"
    networks:
      - ai
networks:
  ai:
    name: ai